name: CD Pipeline - Despliegue Continuo

on:
  push:
    branches: [ main ]

jobs:
  deploy-backend:
    name: Desplegar Servidor Producción
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simulación de Despliegue Backend
        run: |
          echo "Empaquetando artefactos y actualizando servidor de producción..."

  smoke-test:
    name: Smoke Test en Producción
    needs: deploy-backend
    runs-on: ubuntu-latest
    steps:
      - name: Verificación de Estado (Healthcheck)
        run: |
          echo "Verificando disponibilidad de la aplicación pública: HTTP 200 OK"