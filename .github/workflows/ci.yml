name: CI Pipeline - Tio Chu App

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  lint-and-format:
    name: Formato de Código (Laravel Pint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite
      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: |
          cp .env.example .env
          php artisan key:generate
      - run: ./vendor/bin/pint --test
      - name: Análisis estático (PHPStan)
        run: ./vendor/bin/phpstan analyse --memory-limit=1G
      - name: Auditoría de dependencias
        run: |
          audit_succeeded=0
          for i in 1 2 3; do composer audit --locked && { audit_succeeded=1; break; } || { echo "Reintentando composer audit ($i/3)..."; sleep 5; }; done
          if [ "$audit_succeeded" -ne 1 ]; then exit 1; fi

  phpunit-tests:
    name: Pruebas Unitarias e Integración (PHPUnit)
    needs: lint-and-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite
      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: |
          cp .env.example .env
          php artisan key:generate
      - run: php artisan test

  cypress-e2e:
    name: Pruebas E2E (Cypress)
    needs: phpunit-tests
    runs-on: ubuntu-latest
    env:
      CYPRESS_ADMIN_EMAIL: DonLudo@gmail.com
      CYPRESS_ADMIN_PASSWORD: ${{ secrets.CYPRESS_ADMIN_PASSWORD || 'tiochu123' }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: npm ci
      - run: |
          cp .env.example .env
          php artisan key:generate
      - run: npx cypress run